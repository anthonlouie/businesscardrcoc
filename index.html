<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calling Card - Starbucks</title>
<style>
body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f172a;
  font-family: Arial, sans-serif;
}

.avatar {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  overflow: hidden;
  animation: softPulse 5.5s ease-in-out infinite;
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease, filter 0.4s ease;
}

.avatar:hover {
  transform: translateY(-4px) scale(1.05);
  box-shadow: 
    0 0 0 6px rgba(0,98,65,0.12),
    0 14px 34px rgba(0,0,0,.28);
}

.avatar:hover img {
  transform: scale(1.1);
  filter: drop-shadow(0 6px 14px rgba(0,0,0,.3));
}

@keyframes softPulse {
  0% {
    transform: scale(1);
    box-shadow: 0 8px 22px rgba(0,0,0,.22);
  }
  50% {
    transform: scale(1.025);
    box-shadow: 
      0 0 0 6px rgba(0,98,65,0.08),
      0 10px 26px rgba(0,0,0,.25);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 8px 22px rgba(0,0,0,.22);
  }
}
</style>
</head>
<body>

<div class="avatar" aria-label="Starbucks logo">
  <img src="https://upload.wikimedia.org/wikipedia/sco/4/45/Starbucks_Coffee_Logo.svg" alt="Starbucks Logo">
</div>

</body>
</html>
